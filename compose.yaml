name: alocca

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.00
    restart: unless-stopped
    working_dir: /data
    command: server -dir=/data -ip=seaweedfs -filer -filer.port=8888 -volume.max=5 -master.volumeSizeLimitMB=100
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweedfs_data:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alocca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alocca"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  seaweedfs_data:
