services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: teste-local-financeiro
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20
  seaweedfs:
    image: chrislusf/seaweedfs:4.00
    working_dir: /data
    command: server -dir=/data -ip=seaweedfs -filer -filer.port=8888 -volume.max=2 -master.volumeSizeLimitMB=30
    ports:
      - '127.0.0.1:18889:8888'
    volumes:
      - weed_data:/data
volumes:
  weed_data:
