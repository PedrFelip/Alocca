services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alocca_notifications_test
      POSTGRES_USER: alocca_test
      POSTGRES_PASSWORD: local-notifications-test
    ports:
      - '127.0.0.1:55439:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alocca_test -d alocca_notifications_test']
      interval: 2s
      timeout: 2s
      retries: 30
  smtp:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:51025:1025'
      - '127.0.0.1:58025:8025'
